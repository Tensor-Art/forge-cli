name: 复制 dev30 公开运行时
on: workflow_dispatch
permissions: {}
jobs:
  copy:
    if: github.repository == 'Tensor-Art/forge-cli'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 校验并复制公开运行时
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tensor-Art/forge-cli
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO --jq .visibility)" = public
          test "$(gh api repos/$GH_REPO/releases/tags/v0.1.0-dev.30 --jq .draft)" = true
          mkdir transfer
          cd transfer
          cat > SHA256SUMS <<'EOF'
          abd9fde4c15e8d9d4f339fa554ec450fd51517e0221111d5f49f9abd397d7985  tensor-forge-node-22.23.2-darwin-arm64-ab15ce0039d61cea119b887d25a2daa1ced6d0dfabbcc6796ef16cab9013cbf8.tar.gz
          1f3321effde7a44ff4c2de7d1ea8e0d1b2db7df27fdbfac824f57bcb602b3f91  tensor-forge-node-22.23.2-darwin-x64-aa7517861bab8d3dd0c54a3d1d41becb0b1925a017e662018372dbf875dbfce0.tar.gz
          b76850a039b052cb580dbfea98a37812c73f0ab6e8d2688f8eee9c247e1248d8  tensor-forge-node-22.23.2-win32-x64-555d3dceaaf1c5628ac8fa23d1ebde46a424d2ad6782cc2412be8eed4a7a6b69.zip
          EOF
          while read -r digest name; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 20 --max-time 180 --max-filesize 30000000 \
              "https://github.com/$GH_REPO/releases/download/v0.1.0-dev.29/$name" -o "$name"
          done < SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release upload v0.1.0-dev.30 ./*.tar.gz ./*.zip
